<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  html,body{background:#09090b;color:#e4e4e7;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  @keyframes tabIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .tab-in{animation:tabIn .35s cubic-bezier(.2,.8,.2,1)}
  @keyframes toastIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
  .toast-in{animation:toastIn .3s ease-out}
  input[type=number]::-webkit-inner-spin-button{opacity:.4}
  input[type=time]{color-scheme:dark}
  .bar{transition:width .5s cubic-bezier(.2,.8,.2,1)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ---------- Icons (Lucide-style, inline) ---------- */
const P = {
  clock:["M12 6v6l4 2","circle:12,12,10"],
  utensils:["M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2","M7 2v20","M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"],
  dumbbell:["M6.5 6.5v11","M17.5 6.5v11","M3.5 9v6","M20.5 9v6","M6.5 12h11"],
  sparkles:["M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z","M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"],
  droplet:["M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"],
  bell:["M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9","M10.3 21a1.94 1.94 0 0 0 3.4 0"],
  check:["M20 6 9 17l-5-5"],
  flame:["M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"],
  swap:["m17 2 4 4-4 4","M3 11v-1a4 4 0 0 1 4-4h14","m7 22-4-4 4-4","M21 13v1a4 4 0 0 1-4 4H3"],
  down:["m6 9 6 6 6-6"],
  up:["M22 7 13.5 15.5 8.5 10.5 2 17","M16 7h6v6"],
  x:["M18 6 6 18","M6 6l12 12"],
  play:["M6 3l14 9-14 9z"],
  cal:["M8 2v4","M16 2v4","M3 10h18","rect:3,4,18,18,2"],
  shield:["M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z","m9 12 2 2 4-4"],
  target:["circle:12,12,10","circle:12,12,6","circle:12,12,2"],
  plus:["M5 12h14","M12 5v14"],
};
function Icon({name,size=18,className=""}){
  const parts=P[name]||[];
  return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
    {parts.map((d,i)=>{
      if(d.startsWith("circle:")){const [cx,cy,r]=d.slice(7).split(",");return <circle key={i} cx={cx} cy={cy} r={r}/>}
      if(d.startsWith("rect:")){const [x,y,w,h,rx]=d.slice(5).split(",");return <rect key={i} x={x} y={y} width={w} height={h} rx={rx}/>}
      return <path key={i} d={d}/>;
    })}
  </svg>);
}

/* ---------- Helpers ---------- */
const pad=n=>String(n).padStart(2,"0");
const TZ="America/Los_Angeles";
const dkey=(d)=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const ptFmt=new Intl.DateTimeFormat("en-US",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hourCycle:"h23"});
function ptNow(date=new Date()){
  const o={};ptFmt.formatToParts(date).forEach(p=>{o[p.type]=p.value});
  return {key:`${o.year}-${o.month}-${o.day}`,min:Number(o.hour)*60+Number(o.minute),sec:Number(o.second)};
}
const todayPT=()=>ptNow().key;
const parseKey=k=>{const [y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(k,n)=>{const d=parseKey(k);d.setDate(d.getDate()+n);return dkey(d)};
const diffDays=(a,b)=>Math.round((parseKey(b)-parseKey(a))/86400000);
const toMin=s=>{const [h,m]=s.split(":").map(Number);return h*60+m};
const mod=m=>((Math.round(m)%1440)+1440)%1440;
const fmt=m=>{m=mod(m);const h=Math.floor(m/60),mi=m%60;const ap=h>=12?"PM":"AM";const h12=h%12===0?12:h%12;return `${h12}:${pad(mi)} ${ap}`};
const nowMin=()=>ptNow().min;
const weekStart=()=>{const d=parseKey(todayPT());const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return dkey(d)};

/* ---------- Content ---------- */
const MEAL_SLOTS=[
  {id:"b",name:"Breakfast",kcal:550,p:45,options:[
    {title:"Egg Scramble & Whole Wheat Toast",ingredients:["3 whole eggs","1 cup liquid egg whites","2 slices whole wheat toast","1 banana"],prep:"Scramble the whole eggs and liquid egg whites together in a non-stick pan over medium-low heat until just set. Toast the bread and eat with the banana."},
    {title:"Greek Yogurt, Oats & Almonds",ingredients:["1.5 cups Greek yogurt","1.5 oz almonds","1 cup oats","1 cup berries"],prep:"Cook the oats with water (or soak overnight), then top with the yogurt, berries and chopped almonds."}]},
  {id:"l",name:"Lunch",kcal:650,p:45,options:[
    {title:"Chicken, Rice & Broccoli",ingredients:["6 oz grilled chicken breast","1.5 cups cooked rice","1 cup broccoli","1 tbsp olive oil"],prep:"Grill the chicken 5-6 min per side to 165F. Steam or sauté the broccoli in the olive oil. Serve over the rice."},
    {title:"Turkey, Quinoa & Asparagus",ingredients:["6 oz lean turkey breast","1.5 cups cooked quinoa","1 cup asparagus","1 tbsp olive oil"],prep:"Pan-sear the turkey breast until cooked through. Roast or sauté the asparagus in the olive oil for 6-8 min. Serve over the quinoa."}]},
  {id:"pw",name:"Post-Workout Shake",kcal:550,p:45,options:[
    {title:"Whey, Oats & Peanut Butter Shake",ingredients:["1.5 scoops whey isolate","1 cup oats (blended)","1 tbsp peanut butter","1 cup almond milk"],prep:"Add everything to a blender with a few ice cubes and blend 45-60 seconds until smooth. Drink within 45 minutes of training."},
    {title:"Whey, Blueberry & Almond Butter Shake",ingredients:["1.5 scoops whey isolate","1.5 cups skim milk","1 cup frozen blueberries","1.5 tbsp almond butter"],prep:"Blend all ingredients 45-60 seconds until smooth. Drink within 45 minutes of training."}]},
  {id:"d",name:"Dinner",kcal:650,p:40,options:[
    {title:"Lean Beef (or Salmon), Sweet Potato & Salad",ingredients:["6 oz lean ground beef (93/7) or salmon","8 oz baked sweet potato","Large mixed green salad","Light vinaigrette"],prep:"Bake the sweet potato at 425F for 45 min. Brown the beef through (or bake salmon 12-15 min at 400F). Toss the salad with a light vinaigrette."},
    {title:"Sirloin, Baked Potato & Brussels Sprouts",ingredients:["6 oz sirloin steak","8 oz baked white potato","1 cup roasted Brussels sprouts","1 tbsp olive oil"],prep:"Roast the potato at 425F for 45 min and the sprouts (tossed in the olive oil) for 20-25 min. Sear the steak 3-4 min per side and rest 5 min."}]},
  {id:"bed",name:"Bedtime Snack",kcal:200,p:22,options:[
    {title:"Low-Fat Greek Yogurt & Berries",ingredients:["1 cup low-fat Greek yogurt","Handful of berries"],prep:"Spoon yogurt into a bowl and top with berries."},
    {title:"Cottage Cheese & Berries",ingredients:["1 cup low-fat cottage cheese","Handful of berries"],prep:"Spoon cottage cheese into a bowl and top with berries."}]},
];
const TARGET_KCAL=2700, TARGET_P=160, WATER_TARGET=112;

const GYM=[
  {id:"d1",name:"Day 1",title:"Shoulders & Arms",tag:"Mass Focus",ex:[
    {id:"d1a",n:"Seated Dumbbell Shoulder Press",s:3,r:"6-8",rest:"2-3 min"},
    {id:"d1b",n:"Cable Lateral Raises",s:4,r:"12-15",rest:"60-90 s"},
    {id:"d1c",n:"Barbell Bicep Curls",s:3,r:"8-10",rest:"90 s"},
    {id:"d1d",n:"Dumbbell Overhead Tricep Extension",s:3,r:"8-10",rest:"90 s"},
    {id:"d1e",n:"Incline Dumbbell Hammer Curls",s:3,r:"10-12",rest:"60-90 s"},
    {id:"d1f",n:"Tricep Rope Pushdowns",s:4,r:"12-15",rest:"60 s"}]},
  {id:"d2",name:"Day 2",title:"Upper Chest & V-Taper Back",tag:"Width + Thickness",ex:[
    {id:"d2a",n:"Incline Dumbbell Bench Press",s:3,r:"6-8",rest:"2-3 min"},
    {id:"d2b",n:"Wide-Grip Lat Pulldowns",s:4,r:"10-12",rest:"90 s"},
    {id:"d2c",n:"Incline Dumbbell Flyes",s:3,r:"12-15",rest:"60-90 s"},
    {id:"d2d",n:"Chest-Supported Dumbbell Rows",s:3,r:"8-10",rest:"90 s"},
    {id:"d2e",n:"Dumbbell Pullovers",s:3,r:"12",rest:"60-90 s"}]},
  {id:"d3",name:"Day 3",title:"Shoulders, Arms & Abs",tag:"Pump Focus",ex:[
    {id:"d3a",n:"Dumbbell Lateral Raises",s:5,r:"15-20",rest:"45-60 s",note:"Final set: add a drop set"},
    {id:"d3b",n:"Preacher Curls",s:3,r:"10-12",rest:"60-90 s"},
    {id:"d3c",n:"EZ-Bar Skullcrushers",s:3,r:"10-12",rest:"60-90 s"},
    {id:"d3d",n:"Cable Bayesian Bicep Curls",s:3,r:"12-15",rest:"60 s"},
    {id:"d3e",n:"Tricep Overhead Cable Extensions",s:3,r:"12-15",rest:"60 s"},
    {id:"d3f",n:"Hanging Leg Raises",s:3,r:"Failure",rest:"60 s"}]},
  {id:"d4",name:"Day 4",title:"Legs & Proportional Base",tag:"Foundation",ex:[
    {id:"d4a",n:"Hack Squats or Leg Press",s:3,r:"8-10",rest:"2-3 min"},
    {id:"d4b",n:"Seated Leg Curls",s:3,r:"12-15",rest:"90 s"},
    {id:"d4c",n:"Dumbbell Shrugs",s:4,r:"10-12",rest:"60-90 s"},
    {id:"d4d",n:"Standing Calf Raises",s:4,r:"15",rest:"60 s"}]},
];

/* ---------- Notification schedule anchored on work hours ---------- */
function buildSchedule(startStr,endStr){
  const S=toMin(startStr), E=toMin(endStr);
  let L=mod(E-S); if(L===0) L=480;
  const mid=f=>S+Math.round(L*f);
  const ev=[
    {id:"hyg-am",t:S-110,kind:"hygiene",title:"Morning hygiene",body:"Sensodyne / nHAp brush, then Mastermedi tongue scraper."},
    {id:"bk",t:S-80,kind:"food",title:"Breakfast time",body:"Open Food and eat your 550 kcal / 45 g protein breakfast."},
    {id:"w0",t:S-45,kind:"water",water:0,title:"Drink 16 oz Now",body:"Pre-shift hydration."},
    {id:"w1",t:mid(.25),kind:"water",water:1,title:"Drink 16 oz Now",body:"Mid-shift break #1. Quick refill."},
    {id:"lunch",t:mid(.5),kind:"food",title:"Lunch break",body:"Eat lunch, then start Mastic Mint gum within 10 min of finishing."},
    {id:"gum-l",t:mid(.5)+25,kind:"hygiene",title:"Post-meal shield: lunch",body:"Chew Nathan & Sons gum for 15-20 minutes and log it."},
    {id:"w3",t:mid(.75),kind:"water",water:2,title:"Drink 16 oz Now",body:"Mid-shift break #2."},
    {id:"gym",t:E+20,kind:"gym",title:"Training window",body:"Open Gym and log your weights."},
    {id:"w4",t:E+30,kind:"water",water:3,title:"Drink 16 oz Now",body:"Post-shift hydration."},
    {id:"pw",t:E+95,kind:"food",title:"Post-workout meal",body:"550 kcal / 45 g protein shake within 45 minutes of training."},
    {id:"w5",t:E+120,kind:"water",water:4,title:"Drink 16 oz Now",body:"Replace training fluid."},
    {id:"dinner",t:E+160,kind:"food",title:"Dinner time",body:"650 kcal / 40 g protein, then gum within 10 min."},
    {id:"gum-d",t:E+185,kind:"hygiene",title:"Post-meal shield: dinner",body:"Chew gum for 15-20 minutes and log it."},
    {id:"w6",t:E+210,kind:"water",water:5,title:"Drink 16 oz Now",body:"Evening hydration."},
    {id:"bed",t:E+270,kind:"food",title:"Bedtime snack",body:"200 kcal / 22 g protein."},
    {id:"w7",t:E+285,kind:"water",water:6,title:"Drink 16 oz Now",body:"Last full glass of the day."},
    {id:"hyg-pm",t:E+310,kind:"hygiene",title:"Night routine",body:"Crest 3D Whitestrips (Phase 1) or Colgate Optic White Pro + TheraBreath rinse (Phase 2)."},
  ].map(e=>({...e,t:mod(e.t)}));
  const anchor=mod(S-120);
  return ev.sort((a,b)=>mod(a.t-anchor)-mod(b.t-anchor));
}

/* ---------- State ---------- */
const KEY="aesthetic-maxing-v1";
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
const defaultState=()=>({profile:{start:"09:00",end:"17:00",startedOn:todayPT()},days:{},swaps:{},logs:{},baseline:{},ph1Start:null,challenge:null});
function loadState(){
  try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);return {...defaultState(),...s,profile:{...defaultState().profile,...(s.profile||{})}}}}catch(e){}
  return defaultState();
}
const blankDay=()=>({meals:{},water:[],shield:{},ph1:{},ph2:{}});

function App(){
  const [st,setSt]=useState(loadState);
  const [tab,setTab]=useState("food");
  const [toasts,setToasts]=useState([]);
  const [clock,setClock]=useState(ptNow());
  useEffect(()=>{const iv=setInterval(()=>setClock(ptNow()),1000);return ()=>clearInterval(iv)},[]);
  const today=clock.key;
  const firedRef=useRef({});

  useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}},[st]);

  const day=st.days[today]||blankDay();
  const upDay=useCallback((fn,k=today)=>{
    setSt(s=>{const d=s.days[k]||blankDay();const nd=fn(JSON.parse(JSON.stringify(d)));return {...s,days:{...s.days,[k]:nd}}});
  },[today]);

  const schedule=useMemo(()=>buildSchedule(st.profile.start,st.profile.end),[st.profile.start,st.profile.end]);

  const ch=st.challenge;
  const challengeActive=!!ch&&today>=ch.startDate;
  const challengeDay=challengeActive?diffDays(ch.startDate,today)+1:0;
  const tomorrow=addDays(today,1);
  const startChallenge=()=>setSt(s=>({...s,challenge:{startDate:addDays(todayPT(),1)},ph1Start:addDays(todayPT(),1),profile:{...s.profile,startedOn:addDays(todayPT(),1)}}));
  const cancelChallenge=()=>setSt(s=>({...s,challenge:null,ph1Start:null}));

  /* toasts */
  const pushToast=useCallback((t)=>{
    const id=Math.random().toString(36).slice(2);
    setToasts(x=>[...x,{...t,id}]);
    try{if(typeof Notification!=="undefined"&&Notification.permission==="granted"&&document.hidden)new Notification(t.title,{body:t.body})}catch(e){}
    setTimeout(()=>setToasts(x=>x.filter(y=>y.id!==id)),8000);
  },[]);
  const dismiss=id=>setToasts(x=>x.filter(y=>y.id!==id));

  /* real notifications while app is open */
  useEffect(()=>{
    const iv=setInterval(()=>{
      if(!challengeActive)return;
      const n=nowMin();
      schedule.forEach(e=>{
        const k=today+e.id;
        if(e.t===n&&!firedRef.current[k]){firedRef.current[k]=1;pushToast(e)}
      });
    },15000);
    return ()=>clearInterval(iv);
  },[schedule,today,pushToast,challengeActive]);

  /* ---- derived analytics ---- */
  const eatenKcal=MEAL_SLOTS.reduce((a,m)=>a+(day.meals[m.id]?m.kcal:0),0);
  const eatenP=MEAL_SLOTS.reduce((a,m)=>a+(day.meals[m.id]?m.p:0),0);
  const waterOz=day.water.reduce((a,w)=>a+w.oz,0);
  const phase1Day=st.ph1Start?Math.min(14,diffDays(st.ph1Start,today)+1):0;
  const phase1Active=st.ph1Start&&diffDays(st.ph1Start,today)<14&&diffDays(st.ph1Start,today)>=0;
  const hygChecks=phase1Active?[day.ph1.am,day.ph1.pm,day.ph1.wd]:[day.ph2.nhap,day.ph2.optic,day.ph2.rinse,day.ph2.scraper];
  const hygTotal=hygChecks.length+2;
  const hygScore=hygChecks.filter(Boolean).length+(day.shield.lunch==="done"?1:0)+(day.shield.dinner==="done"?1:0);
  const liftsToday=useMemo(()=>{let n=0;GYM.forEach(g=>g.ex.forEach(e=>{if((st.logs[e.id]||[]).some(l=>l.d===today))n++}));return n},[st.logs,today]);

  const streak=useMemo(()=>{
    const start=st.profile.startedOn;
    const status=k=>{const sh=(st.days[k]||{}).shield||{};if(sh.lunch==="missed"||sh.dinner==="missed")return "bad";return sh.lunch==="done"&&sh.dinner==="done"?"full":"open"};
    const t=status(today);
    if(t==="bad")return 0;
    let n=0,k=today;
    if(t==="full")n=1;
    k=addDays(today,-1);
    while(diffDays(start,k)>=0){
      if(status(k)==="full"){n++;k=addDays(k,-1)}else break;
    }
    return n;
  },[st.days,st.profile.startedOn,today]);

  const tabs=[{id:"food",label:"Food",icon:"utensils"},{id:"gym",label:"Gym",icon:"dumbbell"},{id:"hygiene",label:"Hygiene",icon:"sparkles"},{id:"schedule",label:"Schedule",icon:"clock"}];

  return (
  <div className="min-h-screen pb-24">
    <div className="max-w-3xl mx-auto px-4 pt-6">
      <header className="flex items-end justify-between mb-5">
        <div>
          <p className="text-[11px] tracking-[0.25em] uppercase text-teal-300/80">Aesthetic Maxing</p>
          <h1 className="text-2xl font-semibold tracking-tight">Daily Tracker</h1>
        </div>
        <div className="text-right text-xs text-zinc-500">
          <div className="text-zinc-200 font-mono text-sm">{fmtClock(clock)} <span className="text-teal-300/80 text-[10px] tracking-widest">PT</span></div>
          <div>{parseKey(today).toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"})}</div>
          <div>6'0" · 155 lb · Lean Bulk</div>
        </div>
      </header>

      {/* Challenge banner */}
      {!ch&&(<div className="rounded-2xl border border-teal-300/40 bg-gradient-to-br from-teal-300/10 to-transparent p-5 mb-5">
        <div className="text-[11px] uppercase tracking-wider text-teal-300">Ready?</div>
        <div className="text-lg font-semibold mt-1">Start your challenge</div>
        <p className="text-sm text-zinc-400 mt-1">It begins tomorrow morning, {parseKey(tomorrow).toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"})} (Pacific). Reminders and the 14-day Reset Cycle both start then.</p>
        <button onClick={startChallenge} className="mt-3 px-5 py-2.5 rounded-xl bg-teal-300 text-zinc-950 font-semibold text-sm hover:bg-teal-200">Start Challenge</button>
      </div>)}
      {ch&&!challengeActive&&(()=>{const first=schedule[0];const mins=(1440-clock.min)+first.t;const h=Math.floor(mins/60),m=mins%60;
        return (<div className="rounded-2xl border border-teal-300/40 bg-teal-300/5 p-5 mb-5">
        <div className="text-[11px] uppercase tracking-wider text-teal-300">Challenge locked in</div>
        <div className="text-lg font-semibold mt-1">Day 1 starts {parseKey(ch.startDate).toLocaleDateString("en-US",{weekday:"long",month:"short",day:"numeric"})}</div>
        <p className="text-sm text-zinc-400 mt-1">First reminder at {fmt(first.t)} PT, in about {h}h {m}m. Get your meals, gum, strips and gym bag ready.</p>
        <button onClick={cancelChallenge} className="mt-3 text-xs text-zinc-500 hover:text-zinc-300">Cancel challenge</button>
      </div>)})()}
      {challengeActive&&<div className="mb-4 px-1 flex items-center gap-2 text-sm"><span className="px-2.5 py-1 rounded-full bg-teal-300 text-zinc-950 text-xs font-semibold">Day {challengeDay}</span><span className="text-zinc-500">of your challenge · started {parseKey(ch.startDate).toLocaleDateString("en-US",{month:"short",day:"numeric"})}</span></div>}

      {/* Analytics strip */}
      <section className="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-5">
        <Stat label="Calories" value={`${eatenKcal}`} sub={`/ ${TARGET_KCAL} kcal`} pct={eatenKcal/TARGET_KCAL} color="bg-teal-400"/>
        <Stat label="Protein" value={`${eatenP}`} sub={`/ ${TARGET_P} g`} pct={eatenP/TARGET_P} color="bg-sky-400"/>
        <Stat label="Water" value={`${waterOz}`} sub={`/ ${WATER_TARGET} oz`} pct={waterOz/WATER_TARGET} color="bg-cyan-300"/>
        <Stat label="Hygiene" value={`${hygScore}`} sub={`/ ${hygTotal} checks`} pct={hygScore/hygTotal} color="bg-violet-400"/>
      </section>
      <div className="grid grid-cols-2 gap-3 mb-6">
        <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 px-4 py-3 flex items-center gap-3">
          <Icon name="dumbbell" className="text-amber-300"/><div><div className="text-lg font-semibold leading-none">{liftsToday}</div><div className="text-[11px] text-zinc-500 mt-1">lifts logged today</div></div>
        </div>
        <div className="rounded-2xl border border-zinc-800 bg-zinc-900/50 px-4 py-3 flex items-center gap-3">
          <Icon name="flame" className="text-orange-400"/><div><div className="text-lg font-semibold leading-none">{streak} day{streak===1?"":"s"}</div><div className="text-[11px] text-zinc-500 mt-1">stain-free streak</div></div>
        </div>
      </div>

      {/* Tabs */}
      <nav className="flex gap-1 p-1 rounded-2xl bg-zinc-900/70 border border-zinc-800 mb-5">
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>setTab(t.id)}
            className={"flex-1 flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm font-medium transition-all "+(tab===t.id?"bg-teal-300 text-zinc-950 shadow-lg shadow-teal-500/10":"text-zinc-400 hover:text-zinc-100")}>
            <Icon name={t.icon} size={16}/><span>{t.label}</span>

          </div>

            <div className="text-xs text-zinc-400 mt-0.5">{t.body}</div>

function fmtClock(c){const h=Math.floor(c.min/60),m=c.min%60;const ap=h>=12?"PM":"AM";return `${h%12===0?12:h%12}:${pad(m)}:${pad(c.sec)} ${ap}`}
function Stat({label,value,sub,pct,color}){
  const w=Math.max(0,Math.min(1,pct||0))*100;

function Card({children,className=""}){return <div className={"rounded-2xl border border-zinc-800 bg-zinc-900/50 "+className}>{children}</div>}
function Switch({on,onClick,label}){
  return (<button role="switch" aria-checked={on} aria-label={label} onClick={onClick} className={"relative h-6 w-11 rounded-full transition-colors shrink-0 "+(on?"bg-teal-400":"bg-zinc-700")}>

}
function CheckRow({on,onClick,title,sub}){

function Food({st,setSt,day,upDay,schedule,waterOz}){

  const waterEvents=schedule.filter(e=>e.kind==="water");
  const logged=day.water.length;
  const next=waterEvents[Math.min(logged,waterEvents.length-1)];
  const remaining=Math.max(0,WATER_TARGET-waterOz);
  const nowM=nowMin();
  const anchor=mod(toMin(st.profile.start)-120);
  const due=next&&mod(nowM-anchor)>=mod(next.t-anchor);
  return (<div className="space-y-4">
    {/* Water */}
    <Card className="p-5">
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-2"><Icon name="droplet" className="text-cyan-300"/><h2 className="font-semibold">Water Log</h2></div>
        <div className="text-sm text-zinc-400">{waterOz} / {WATER_TARGET} oz</div>
      </div>
      <div className="mt-3 h-2 rounded-full bg-zinc-800 overflow-hidden"><div className="h-full bar bg-gradient-to-r from-cyan-400 to-sky-400" style={{width:Math.min(100,waterOz/WATER_TARGET*100)+"%"}}/></div>
      {remaining>0?(
        <div className={"mt-4 rounded-xl p-4 border "+(due?"border-cyan-400/50 bg-cyan-400/10":"border-zinc-800 bg-zinc-950/50")}>

          <div className="text-xl font-semibold mt-1">Drink {Math.min(16,remaining)} oz {due?"Now":"at "+(next&&fmt(next.t))}</div>
          <div className="flex gap-2 mt-3">
            <button onClick={()=>upDay(d=>{d.water.push({t:fmt(nowMin()),oz:Math.min(16,remaining)});return d})} className="px-4 py-2 rounded-lg bg-cyan-300 text-zinc-950 text-sm font-medium hover:bg-cyan-200">Log compliance</button>
            <button onClick={()=>upDay(d=>{d.water.push({t:fmt(nowMin()),oz:8});return d})} className="px-3 py-2 rounded-lg border border-zinc-700 text-sm text-zinc-300 hover:border-zinc-500 flex items-center gap-1"><Icon name="plus" size={14}/>8 oz extra</button>

            <div className="font-medium">{fmt(e.t)}</div><div>16 oz{i<logged&&day.water[i]?` · logged ${day.water[i].t}`:""}</div>
          </div>))}

      {day.water.length>0&&<button onClick={()=>upDay(d=>{d.water.pop();return d})} className="mt-3 text-xs text-zinc-500 hover:text-zinc-300">Undo last entry</button>}
    </Card>

    {/* Meals */}
    {MEAL_SLOTS.map(m=>{
      const idx=st.swaps[m.id]||0; const opt=m.options[idx]; const eaten=!!day.meals[m.id];
      const ev=schedule.find(e=>e.id===({b:"bk",l:"lunch",pw:"pw",d:"dinner",bed:"bed"})[m.id]);
      const isOpen=!!open[m.id];
      return (<Card key={m.id} className={"p-5 "+(eaten?"border-teal-400/40":"")}>
        <div className="flex items-start justify-between gap-3">
          <div>
            <div className="text-[11px] uppercase tracking-wider text-zinc-500">{m.name}{ev&&` · ${fmt(ev.t)}`}</div>
            <h3 className="text-lg font-semibold mt-0.5">{opt.title}</h3>
            <div className="text-xs text-zinc-400 mt-1">~{m.kcal} kcal · {m.p}g protein <span className="text-zinc-600">(swap matches)</span></div>
          </div>
          <Switch on={eaten} label={"Mark "+m.name+" eaten"} onClick={()=>upDay(d=>{d.meals[m.id]=!d.meals[m.id];return d})}/>
        </div>
        <div className="flex gap-2 mt-4">
          <button onClick={()=>setSt(s=>({...s,swaps:{...s.swaps,[m.id]:((s.swaps[m.id]||0)+1)%m.options.length}}))} className="flex items-center gap-2 px-3 py-2 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-sm"><Icon name="swap" size={15}/>Quick-Swap Alternative</button>

/* ---------- GYM ---------- */

function BodyTracker({st,setSt,today}){
  const [wt,setWt]=useState("");
  const fileRef=useRef(null);
  const [busy,setBusy]=useState(false);
  const entries=st.body||[];
  const add=(patch)=>setSt(s=>{
    const list=[...(s.body||[])];
    const i=list.findIndex(x=>x.d===today);
    if(i>=0)list[i]={...list[i],...patch};else list.push({d:today,...patch});
    list.sort((a,b)=>a.d<b.d?-1:1);
    return {...s,body:list};
  });
  const saveW=()=>{const n=parseFloat(wt);if(n>0){add({w:n});setWt("")}};
  const onFile=(ev)=>{
    const f=ev.target.files&&ev.target.files[0];if(!f)return;setBusy(true);
    const img=new Image();const url=URL.createObjectURL(f);
    img.onload=()=>{
      const sc=Math.min(1,360/Math.max(img.width,img.height));
      const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      add({photo:c.toDataURL("image/jpeg",0.7)});URL.revokeObjectURL(url);setBusy(false);
    };
    img.onerror=()=>{setBusy(false)};img.src=url;ev.target.value="";
  };
  const weights=entries.filter(x=>x.w);
  const first=weights[0],last=weights[weights.length-1];
  const photos=entries.filter(x=>x.photo);
  const mx=Math.max(...weights.map(x=>x.w),1),mn=Math.min(...weights.map(x=>x.w),mx);
  return (<Card className="p-5">
    <div className="flex items-center justify-between">
      <div className="flex items-center gap-2"><Icon name="target" className="text-amber-300"/><h2 className="font-semibold">Weight & Progress Photos</h2></div>
      {last&&<div className="text-sm text-zinc-400">{last.w} lb{first&&first!==last?` (${last.w-first.w>0?"+":""}${(last.w-first.w).toFixed(1)} since start)`:""}</div>}
    </div>
    <div className="mt-3 flex items-center gap-2">
      <input type="number" inputMode="decimal" placeholder="Body weight (lb)" value={wt} onChange={e=>setWt(e.target.value)} onKeyDown={e=>e.key==="Enter"&&saveW()} className="w-40 rounded-lg bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm focus:outline-none focus:border-amber-300"/>
      <button onClick={saveW} disabled={!(parseFloat(wt)>0)} className="px-3 py-2 rounded-lg bg-amber-300 text-zinc-950 text-sm font-medium disabled:opacity-30">Log weight</button>
      <input ref={fileRef} type="file" accept="image/*" onChange={onFile} className="hidden"/>
      <button onClick={()=>fileRef.current&&fileRef.current.click()} className="px-3 py-2 rounded-lg border border-zinc-700 text-sm text-zinc-300 hover:border-zinc-500">{busy?"Saving…":"Add photo"}</button>
    </div>
    {weights.length>1&&<div className="mt-4 flex items-end gap-1 h-20">
      {weights.slice(-30).map(x=>(<div key={x.d} title={x.d+": "+x.w+" lb"} className="flex-1 rounded-t bg-amber-300/70" style={{height:(20+((x.w-mn)/((mx-mn)||1))*80)+"%"}}/>))}
    </div>}
    {weights.length>0&&<div className="mt-3 flex flex-wrap gap-1.5 text-xs">{weights.slice(-6).reverse().map(x=><span key={x.d} className="px-2 py-1 rounded-md bg-zinc-800 text-zinc-300">{x.d.slice(5)}: {x.w} lb</span>)}</div>}
    <div className="mt-4 grid grid-cols-3 sm:grid-cols-4 gap-2">
      {photos.slice(-8).reverse().map(x=>(<div key={x.d} className="relative rounded-lg overflow-hidden border border-zinc-800 aspect-[3/4] bg-zinc-950"><img src={x.photo} className="w-full h-full object-cover" alt={"Progress "+x.d}/><div className="absolute bottom-0 inset-x-0 text-[10px] bg-black/60 px-1.5 py-0.5">{x.d.slice(5)}</div></div>))}
      {photos.length===0&&<div className="col-span-3 sm:col-span-4 rounded-lg border border-dashed border-zinc-800 py-6 text-center text-xs text-zinc-600">No progress photos yet. Photos stay on this device.</div>}
    </div>
  </Card>);
}

function bestOf(list){
  let b=null;(list||[]).forEach(l=>{const e=l.w*(1+l.r/30);if(!b||e>b.e)b={...l,e}});return b;
}
function Gym({st,setSt,today}){
  const [sel,setSel]=useState("d1");
  const g=GYM.find(x=>x.id===sel);
  const done=g.ex.filter(e=>(st.logs[e.id]||[]).some(l=>l.d===today)).length;
  return (<div className="space-y-4">
    <div className="grid grid-cols-2 sm:grid-cols-4 gap-2">
      {GYM.map(x=>(
        <button key={x.id} onClick={()=>setSel(x.id)} className={"text-left rounded-xl border p-3 transition-all "+(sel===x.id?"border-amber-300/60 bg-amber-300/10":"border-zinc-800 bg-zinc-900/50 hover:border-zinc-600")}>
          <div className="text-[11px] uppercase tracking-wider text-zinc-500">{x.name}</div>
          <div className="text-sm font-semibold leading-tight mt-0.5">{x.title}</div>
          <div className="text-[11px] text-amber-300/80 mt-1">{x.tag}</div>
        </button>))}
    </div>
    <div className="flex items-center justify-between px-1">
      <div className="text-sm text-zinc-400">{done}/{g.ex.length} exercises logged today</div>
      <div className="h-1.5 w-32 rounded-full bg-zinc-800 overflow-hidden"><div className="h-full bar bg-amber-300" style={{width:(done/g.ex.length*100)+"%"}}/></div>
    </div>
    <div key={sel} className="tab-in space-y-3">
      {g.ex.map(e=><Exercise key={e.id} e={e} st={st} setSt={setSt} today={today}/>)}
    </div>
    <BodyTracker st={st} setSt={setSt} today={today}/>
  </div>);
}
function Exercise({e,st,setSt,today}){
  const logs=st.logs[e.id]||[];
  const ws=weekStart();
  const prior=bestOf(logs.filter(l=>l.d<ws));
  const base=st.baseline[e.id];
  const lastBest=prior||(base?{w:base.w,r:base.r,e:base.w*(1+base.r/30),manual:true}:null);
  const thisWeek=bestOf(logs.filter(l=>l.d>=ws));
  const [w,setW]=useState(""),[r,setR]=useState("");
  const [bw,setBw]=useState(""),[br,setBr]=useState("");
  const [showBase,setShowBase]=useState(false);
  const wn=parseFloat(w),rn=parseInt(r);
  const valid=wn>0&&rn>0;
  const cmp=valid&&lastBest?(wn*(1+rn/30))-lastBest.e:null;
  const todays=logs.filter(l=>l.d===today);
  const log=()=>{if(!valid)return;setSt(s=>({...s,logs:{...s.logs,[e.id]:[...(s.logs[e.id]||[]),{d:today,w:wn,r:rn}]}}));setR("")};
  const saveBase=()=>{const a=parseFloat(bw),b=parseInt(br);if(a>0&&b>0){setSt(s=>({...s,baseline:{...s.baseline,[e.id]:{w:a,r:b}}}));setShowBase(false)}};
  return (<Card className={"p-4 "+(todays.length?"border-amber-300/30":"")}>
    <div className="flex items-start justify-between gap-3">
      <div>
        <h3 className="font-semibold">{e.n}</h3>
        <div className="text-xs text-zinc-400 mt-1">{e.s} sets × {e.r}{e.r==="Failure"?"":" reps"} · rest {e.rest}</div>{e.note&&<div className="text-xs text-amber-300/80 mt-0.5">{e.note}</div>}
      </div>
      <div className="text-right text-xs shrink-0">
        <div className="text-zinc-500">Last week's best</div>
        <div className="text-zinc-200 font-medium">{lastBest?`${lastBest.w} × ${lastBest.r}`:"—"}</div>
      </div>
    </div>
    <div className="mt-3 flex items-center gap-2">
      <input type="number" inputMode="decimal" placeholder="Weight" value={w} onChange={ev=>setW(ev.target.value)} className="w-24 rounded-lg bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm focus:outline-none focus:border-amber-300"/>
      <span className="text-zinc-600">×</span>
      <input type="number" inputMode="numeric" placeholder="Reps" value={r} onChange={ev=>setR(ev.target.value)} onKeyDown={ev=>ev.key==="Enter"&&log()} className="w-20 rounded-lg bg-zinc-950 border border-zinc-700 px-3 py-2 text-sm focus:outline-none focus:border-amber-300"/>
      <button onClick={log} disabled={!valid} className="px-3 py-2 rounded-lg bg-amber-300 text-zinc-950 text-sm font-medium disabled:opacity-30">Log set</button>
      {cmp!==null&&<span className={"text-xs font-medium flex items-center gap-1 "+(cmp>0.01?"text-emerald-300":cmp<-0.01?"text-rose-300":"text-zinc-400")}>
        {cmp>0.01?<><Icon name="up" size={14}/>Beats last week</>:cmp<-0.01?"Below last week":"Matches last week"}</span>}
    </div>
    {(todays.length>0||thisWeek)&&<div className="mt-3 flex flex-wrap gap-1.5 text-xs">
      {todays.map((l,i)=><span key={i} className="px-2 py-1 rounded-md bg-zinc-800 text-zinc-300">Set {i+1}: {l.w} × {l.r}</span>)}
      {thisWeek&&<span className="px-2 py-1 rounded-md bg-amber-300/10 text-amber-200">This week's best: {thisWeek.w} × {thisWeek.r}</span>}
      {todays.length>0&&<button onClick={()=>setSt(s=>{const arr=[...(s.logs[e.id]||[])];for(let i=arr.length-1;i>=0;i--){if(arr[i].d===today){arr.splice(i,1);break}}return {...s,logs:{...s.logs,[e.id]:arr}}})} className="px-2 py-1 text-zinc-500 hover:text-zinc-300">Undo last</button>}
    </div>}
    {!prior&&<div className="mt-2">
      <button onClick={()=>setShowBase(v=>!v)} className="text-xs text-zinc-500 hover:text-zinc-300">{base?"Edit":"Enter"} last week's best manually</button>
      {showBase&&<div className="tab-in mt-2 flex items-center gap-2">
        <input type="number" placeholder="Weight" value={bw} onChange={ev=>setBw(ev.target.value)} className="w-24 rounded-lg bg-zinc-950 border border-zinc-700 px-3 py-1.5 text-sm"/>
        <span className="text-zinc-600">×</span>
        <input type="number" placeholder="Reps" value={br} onChange={ev=>setBr(ev.target.value)} className="w-20 rounded-lg bg-zinc-950 border border-zinc-700 px-3 py-1.5 text-sm"/>
        <button onClick={saveBase} className="px-3 py-1.5 rounded-lg border border-zinc-600 text-sm">Save</button>
      </div>}
    </div>}
  </Card>);
}

/* ---------- HYGIENE ---------- */
function Hygiene({st,setSt,day,upDay,today,streak,phase1Day,phase1Active}){
  const [timer,setTimer]=useState(null);
  useEffect(()=>{
    if(timer===null)return;
    if(timer<=0){return}
    const t=setTimeout(()=>setTimer(x=>x-1),1000);
    return ()=>clearTimeout(t);
  },[timer]);
  const ph1Over=st.ph1Start&&diffDays(st.ph1Start,today)>=14;
  const dn=phase1Day;
  const ph1Today=(st.days[today]||{}).ph1||{};
  const days14=Array.from({length:14},(_,i)=>i+1);
  const dayDone=i=>{const k=addDays(st.ph1Start,i-1);const p=(st.days[k]||{}).ph1||{};return p.am&&p.pm&&p.wd};
  const set1=(f)=>upDay(d=>{d.ph1[f]=!d.ph1[f];return d});
  const set2=(f)=>upDay(d=>{d.ph2[f]=!d.ph2[f];return d});
  const shield=(meal,v)=>upDay(d=>{d.shield[meal]=d.shield[meal]===v?null:v;return d});
  const mm=timer!==null?`${pad(Math.floor(Math.max(0,timer)/60))}:${pad(Math.max(0,timer)%60)}`:"45:00";
  return (<div className="space-y-4">
    {/* Shield */}
    <Card className="p-5 border-orange-400/30">
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-2"><Icon name="shield" className="text-orange-300"/><h2 className="font-semibold">Post-Meal Shield</h2></div>
        <div className="flex items-center gap-2 px-3 py-1.5 rounded-full bg-orange-400/10 border border-orange-400/30"><Icon name="flame" size={16} className="text-orange-400"/><span className="text-sm font-semibold">{streak}</span><span className="text-xs text-zinc-400">day stain-free streak</span></div>
      </div>
      <p className="text-xs text-zinc-500 mt-2">Chew Nathan & Sons Underbrush Mastic Mint gum for 15-20 minutes, started within 10 minutes of finishing the meal. Miss one and the streak resets to zero.</p>
      <div className="mt-4 space-y-2">
        {["lunch","dinner"].map(m=>(
          <div key={m} className={"rounded-xl border px-4 py-3 flex items-center gap-3 "+(day.shield[m]==="done"?"border-teal-400/40 bg-teal-400/5":day.shield[m]==="missed"?"border-rose-400/40 bg-rose-400/5":"border-zinc-800")}>
            <div className="flex-1"><div className="text-sm font-medium capitalize">{m} shield</div><div className="text-xs text-zinc-500">{day.shield[m]==="done"?"Gum chewed 15-20 min. Shield up.":day.shield[m]==="missed"?"Missed. Streak reset.":"Chewed gum within 10 min for 15-20 min?"}</div></div>
            <button onClick={()=>shield(m,"done")} className={"px-3 py-1.5 rounded-lg text-sm font-medium "+(day.shield[m]==="done"?"bg-teal-400 text-zinc-950":"bg-zinc-800 hover:bg-zinc-700")}>Done</button>
            <button onClick={()=>shield(m,"missed")} className={"px-3 py-1.5 rounded-lg text-sm "+(day.shield[m]==="missed"?"bg-rose-400 text-zinc-950 font-medium":"bg-zinc-800 hover:bg-zinc-700 text-zinc-300")}>Missed</button>
          </div>))}
      </div>
    </Card>

    {/* Phase 1 */}
    <Card className="p-5">
      <div className="flex items-center justify-between">
        <div><div className="text-[11px] uppercase tracking-wider text-violet-300">Phase 1</div><h2 className="font-semibold">The Reset Cycle · 14 days</h2></div>
        {st.ph1Start&&<div className="text-sm text-zinc-400">{ph1Over?"Complete":`Day ${dn} of 14`}</div>}
      </div>
      {!st.ph1Start?(
        <div className="mt-4"><p className="text-sm text-zinc-400">Morning Sensodyne, nightly Crest 3D Whitestrips for 45 minutes, and a White Diet (avoid coffee, tea, red wine, soy sauce, berries and dark sauces).</p>
          <button onClick={()=>setSt(s=>({...s,ph1Start:today}))} className="mt-3 px-4 py-2 rounded-lg bg-violet-300 text-zinc-950 text-sm font-medium">Start Day 1 today</button></div>
      ):(<>
        <div className="mt-4 grid grid-cols-7 gap-1.5">
          {days14.map(i=>{const dn2=diffDays(st.ph1Start,today)+1;const fut=i>dn2;const ok=!fut&&dayDone(i);
            return <div key={i} className={"h-9 rounded-lg text-xs flex items-center justify-center border "+(ok?"bg-violet-300 text-zinc-950 border-violet-300 font-semibold":i===dn2?"border-violet-300 text-violet-200":fut?"border-zinc-900 text-zinc-700":"border-zinc-800 text-zinc-500")}>{i}</div>})}
        </div>
        {phase1Active&&<div className="mt-4 space-y-2">
          <CheckRow on={!!ph1Today.am} onClick={()=>set1("am")} title="Morning Sensodyne" sub="Brush 2 minutes, don't rinse right away."/>
          <CheckRow on={!!ph1Today.pm} onClick={()=>set1("pm")} title="Nightly Crest 3D Whitestrips · 45 min" sub="Apply to clean, dry teeth."/>
          <div className="flex items-center gap-3 rounded-xl border border-zinc-800 px-4 py-3">
            <div className="flex-1"><div className="text-sm font-medium">Strip timer</div><div className="text-xs text-zinc-500">45 minutes</div></div>
            <div className={"font-mono text-lg "+(timer===0?"text-teal-300":"")}>{mm}</div>
            <button onClick={()=>setTimer(timer===null||timer===0?45*60:null)} className="px-3 py-1.5 rounded-lg bg-zinc-800 hover:bg-zinc-700 text-sm flex items-center gap-1">{timer===null||timer===0?<><Icon name="play" size={12}/>Start</>:"Reset"}</button>
          </div>
          <div className="flex items-center gap-3 rounded-xl border border-zinc-800 px-4 py-3">
            <div className="flex-1"><div className="text-sm font-medium">White Diet</div><div className="text-xs text-zinc-500">No staining foods or drinks today.</div></div>
            <Switch on={!!ph1Today.wd} label="White diet" onClick={()=>set1("wd")}/>
          </div>
        </div>}
        {ph1Over&&<div className="mt-4 rounded-xl border border-teal-400/40 bg-teal-400/10 p-4 text-sm text-teal-200">Reset Cycle finished. Phase 2 maintenance is your daily routine now.</div>}
      </>)}
    </Card>

    {/* Phase 2 */}
    <Card className="p-5">
      <div className="text-[11px] uppercase tracking-wider text-sky-300">Phase 2</div>
      <h2 className="font-semibold">365-Day Maintenance</h2>
      <div className="mt-4 space-y-2">
        <CheckRow on={!!day.ph2.nhap} onClick={()=>set2("nhap")} title="Morning nHAp paste brush" sub="Nano-hydroxyapatite toothpaste."/>
        <CheckRow on={!!day.ph2.scraper} onClick={()=>set2("scraper")} title="Mastermedi Stainless Steel Tongue Scraper" sub="Morning check, back to front 5-7 passes."/>
        <CheckRow on={!!day.ph2.optic} onClick={()=>set2("optic")} title="Nightly Colgate Optic White Pro Series brush" sub="Brush 2 minutes before bed."/>
        <CheckRow on={!!day.ph2.rinse} onClick={()=>set2("rinse")} title="TheraBreath Fresh Breath Mouthwash rinse" sub="Rinse 30 seconds, don't swallow."/>
      </div>
      <MaintStreak st={st} today={today}/>
    </Card>
  </div>);
}
function MaintStreak({st,today}){
  const days=Array.from({length:14},(_,i)=>addDays(today,i-13));
  return (<div className="mt-4"><div className="text-xs text-zinc-500 mb-2">Last 14 days of maintenance</div>
    <div className="flex gap-1">{days.map(k=>{const p=((st.days[k]||{}).ph2)||{};const n=[p.nhap,p.scraper,p.optic,p.rinse].filter(Boolean).length;
      return <div key={k} title={k} className={"flex-1 h-6 rounded "+(n===4?"bg-sky-400":n>=2?"bg-sky-400/60":n===1?"bg-sky-400/30":"bg-zinc-800")}/>})}</div></div>);
}

/* ---------- SCHEDULE ---------- */
function Schedule({st,setSt,schedule,pushToast}){
  const set=(f,v)=>setSt(s=>({...s,profile:{...s.profile,[f]:v}}));
  const S=toMin(st.profile.start);let L=mod(toMin(st.profile.end)-S);if(L===0)L=480;
  const inShift=t=>mod(t-S)<L;
  return (<div className="space-y-4">
    <Card className="p-5">
      <div className="flex items-center gap-2"><Icon name="clock" className="text-teal-300"/><h2 className="font-semibold">Master Schedule</h2></div>
      <p className="text-xs text-zinc-500 mt-2">Set your work shift. Every reminder is anchored to it: before the shift, on mid-shift breaks, or after the shift. Overnight shifts work too.</p>
      <div className="grid grid-cols-2 gap-3 mt-4">
        <label className="text-xs text-zinc-400">Work starts<input type="time" value={st.profile.start} onChange={ev=>ev.target.value&&set("start",ev.target.value)} className="mt-1 w-full rounded-lg bg-zinc-950 border border-zinc-700 px-3 py-2 text-base text-zinc-100 focus:outline-none focus:border-teal-300"/></label>
        <label className="text-xs text-zinc-400">Work ends<input type="time" value={st.profile.end} onChange={ev=>ev.target.value&&set("end",ev.target.value)} className="mt-1 w-full rounded-lg bg-zinc-950 border border-zinc-700 px-3 py-2 text-base text-zinc-100 focus:outline-none focus:border-teal-300"/></label>
      </div>
      <div className="mt-3 text-xs text-zinc-500">Shift length: {Math.floor(L/60)}h {L%60}m</div>
    </Card>
    <Card className="p-5">
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-2"><Icon name="bell" className="text-teal-300"/><h2 className="font-semibold">Today's Notification Plan</h2></div>
        <button onClick={()=>pushToast(schedule[Math.floor(Math.random()*schedule.length)])} className="text-xs px-3 py-1.5 rounded-lg bg-teal-300 text-zinc-950 font-medium">Simulate random</button>
      </div>
      <div className="mt-4 divide-y divide-zinc-800">
        {schedule.map(e=>(
          <div key={e.id} className="py-2.5 flex items-center gap-3">
            <div className="w-20 text-sm font-mono text-zinc-300 shrink-0">{fmt(e.t)}</div>
            <div className={"h-2 w-2 rounded-full shrink-0 "+(e.kind==="water"?"bg-cyan-300":e.kind==="food"?"bg-teal-300":e.kind==="gym"?"bg-amber-300":"bg-violet-300")}/>
            <div className="flex-1 min-w-0"><div className="text-sm truncate">{e.title}</div><div className="text-xs text-zinc-500 truncate">{e.body}</div></div>
            {inShift(e.t)&&<span className="text-[10px] px-1.5 py-0.5 rounded bg-zinc-800 text-zinc-400 shrink-0">break</span>}
            <button onClick={()=>pushToast(e)} className="text-xs px-2.5 py-1 rounded-md border border-zinc-700 text-zinc-300 hover:border-zinc-500 shrink-0">Simulate</button>
          </div>))}
      </div>
      <p className="text-xs text-zinc-600 mt-3">All times are Pacific. Reminders pop up as in-app toasts while this page is open, once your challenge has started. Browsers can't push alerts to a closed tab.</p>
    </Card>
    <Card className="p-5">
      <h2 className="font-semibold">Data</h2>
      <p className="text-xs text-zinc-500 mt-1">Saved on this device. Copy a backup code now and then, so you can restore it if your phone ever clears the app.</p>
      <Backup st={st} setSt={setSt}/>
      <NotifyToggle/>
      <ResetButton setSt={setSt}/>
    </Card>
  </div>);
}
function Backup({st,setSt}){
  const [txt,setTxt]=useState("");const [msg,setMsg]=useState("");
  const code=()=>{try{return btoa(unescape(encodeURIComponent(JSON.stringify(st))))}catch(e){return ""}};
  const copy=async()=>{const c=code();setTxt(c);try{await navigator.clipboard.writeText(c);setMsg("Backup code copied.")}catch(e){setMsg("Select the code below and copy it.")}};
  const restore=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob(txt.trim()))));if(!o.profile)throw 0;setSt({...defaultState(),...o});setMsg("Restored.")}catch(e){setMsg("That code didn't work.")}};
  return (<div className="mt-3">
    <div className="flex gap-2"><button onClick={copy} className="text-sm px-3 py-1.5 rounded-lg border border-zinc-700 text-zinc-300 hover:border-zinc-500">Copy backup code</button>
    <button onClick={restore} disabled={!txt.trim()} className="text-sm px-3 py-1.5 rounded-lg border border-zinc-700 text-zinc-300 hover:border-zinc-500 disabled:opacity-30">Restore from code</button></div>
    <textarea value={txt} onChange={e=>setTxt(e.target.value)} placeholder="Paste a backup code here to restore" rows={2} className="mt-2 w-full rounded-lg bg-zinc-950 border border-zinc-700 px-3 py-2 text-xs"/>
    {msg&&<div className="text-xs text-teal-300 mt-1">{msg}</div>}
  </div>);
}
function NotifyToggle(){
  const [perm,setPerm]=useState(typeof Notification!=="undefined"?Notification.permission:"unsupported");
  if(perm==="unsupported")return null;
  return (<div className="mt-3 text-sm"><button onClick={async()=>{try{setPerm(await Notification.requestPermission())}catch(e){}}} className="px-3 py-1.5 rounded-lg border border-zinc-700 text-zinc-300 hover:border-zinc-500">{perm==="granted"?"Phone notifications on":"Allow phone notifications"}</button>
  <span className="text-xs text-zinc-600 ml-2">Works while the app is open. For alerts when closed, use the Google Calendar reminders.</span></div>);
}
function ResetButton({setSt}){
  const [c,setC]=useState(false);
  return c?(<div className="mt-3 flex items-center gap-2 text-sm"><span className="text-rose-300">Erase all logs?</span>
    <button onClick={()=>{setSt(defaultState());setC(false)}} className="px-3 py-1.5 rounded-lg bg-rose-400 text-zinc-950 font-medium">Yes, erase</button>
    <button onClick={()=>setC(false)} className="px-3 py-1.5 rounded-lg bg-zinc-800">Cancel</button></div>)
  :(<button onClick={()=>setC(true)} className="mt-3 text-sm px-3 py-1.5 rounded-lg border border-zinc-700 text-zinc-300 hover:border-rose-400/60">Reset all data</button>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
